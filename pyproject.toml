[project]
name = "numpy-neural-networks"
version = "0.1.0"
description = "Учебная библиотека глубокого обучения реализована с нуля на NumPy"
readme = "README.md"
authors = [
    { name = "Dmitriy Latkin", email = "lda020504@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"


[tool.uv.build-backend]
module-name = "numpy_nn"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=6.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --cov=numpy_nn --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
